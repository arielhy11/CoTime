name: cohuman.dev package

# Re-packages the live cohuman.dev site (homepage + CoKids, unchanged) together with
# the /cotime proxy rule, for a single Netlify drag-and-drop deploy.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cohuman-site.yml
      - web/cohuman/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current cohuman.dev files
        run: |
          set -euo pipefail
          mkdir -p out/cokids
          get() { curl -fsSL --retry 3 "https://cohuman.dev/$1" -o "out/$1"; }
          get index.html
          get robots.txt
          for f in index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png; do get "cokids/$f"; done
          # Netlify injects its HUD script into served HTML; remove it to get the original files back.
          for f in out/index.html out/cokids/index.html; do
            perl -0pi -e 's#<script[^>]*/\.netlify/[^>]*>\s*</script>##g' "$f"
          done
          echo "::notice::SIZES $(cd out && find . -type f -printf '%p=%s ' | sort)"
          # Report response headers (one line per path) so _headers can be reproduced exactly.
          for p in / /robots.txt /cokids/ /cokids/sw.js /cokids/manifest.webmanifest /cokids/icon-192.png; do
            h=$(curl -fsSI "https://cohuman.dev$p" | tr -d '\r' | grep -iE '^(cache-control|x-robots-tag|service-worker-allowed|content-type|x-frame-options|x-content-type-options|referrer-policy|permissions-policy|content-security-policy):' | tr '\n' '|')
            echo "::notice::HDR $p -> $h"
          done
          echo "::notice::SW $(grep -oE "['\"][^'\"]+\.(png|webmanifest|html|js|svg|json|ico)['\"]" out/cokids/sw.js | sort -u | tr '\n' ' ')"
          grep -c '\.netlify/' out/index.html out/cokids/index.html || true
          [ -f web/cohuman/_headers ] && cp web/cohuman/_headers out/_headers
          cp web/cohuman/_redirects out/_redirects
          ls -la out out/cokids
      - name: Publish package branch
        run: |
          cd out
          zip -qr9 ../cohuman-site.zip .
          cd ..
          mkdir pkg && mv cohuman-site.zip pkg/ && cd pkg
          git init -q -b cohuman-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "cohuman.dev package for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" cohuman-site
