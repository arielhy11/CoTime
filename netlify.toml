# Netlify builds the Expo web app and serves it at cohuman.dev/cotime.

[build]
  command = "npx expo export -p web && rm -rf site && mkdir -p site/cotime && cp -R dist/. site/cotime/"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Firebase web config. These values are public by design (they ship inside
  # the browser bundle); access is enforced by firestore.rules.
  EXPO_PUBLIC_API_KEY = "AIzaSyBrazWNRuIqMyccx5lpjTglASnps_pm4nI"
  EXPO_PUBLIC_AUTH_DOMAIN = "cotime-5ef18.firebaseapp.com"
  EXPO_PUBLIC_PROJECT_ID = "cotime-5ef18"
  EXPO_PUBLIC_STORAGE_BUCKET = "cotime-5ef18.firebasestorage.app"
  EXPO_PUBLIC_MESSAGING_SENDER_ID = "184355196707"
  EXPO_PUBLIC_APP_ID = "1:184355196707:web:d1d5c0b5595a660097c696"

# Root of the domain → the app.
[[redirects]]
  from = "/"
  to = "/cotime/"
  status = 302

# Old / capitalised links.
[[redirects]]
  from = "/CoTime/*"
  to = "/cotime/:splat"
  status = 301

[[redirects]]
  from = "/cotask/*"
  to = "/cotime/:splat"
  status = 301

[[redirects]]
  from = "/CoTask/*"
  to = "/cotime/:splat"
  status = 301

# Single-page app: any deep link (e.g. /cotime/join?code=ABCD) loads the app shell.
[[redirects]]
  from = "/cotime/*"
  to = "/cotime/index.html"
  status = 200

[[headers]]
  for = "/cotime/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
